<style>
:root {
  --ink: #262433;
  --ink-soft: #6f6c80;

  --floor: #dfe8f1;
  --surface: #ffffff;

  --line: #d7dfea;
  --line-strong: #b9c5d6;

  --a-idea: #e8960c;
  --a-idea-soft: #fdf1da;
  --b-plan: #3f7fd1;
  --b-plan-soft: #e2edfb;
  --c-money: #1f9d6c;
  --c-money-soft: #dff3e9;
  --d-decision: #8656c9;
  --d-decision-soft: #ede3fa;
  --e-dev: #1fa39a;
  --e-dev-soft: #dcf3f1;

}
* { box-sizing: border-box; }
html, body, #root { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(1100px 500px at 12% -8%, #f4f8fc 0%, transparent 55%), var(--bg);
  color: var(--ink);

}
button { font-family: inherit; cursor: pointer; }
textarea, input, select { font-family: inherit; }

.app-shell { max-width: 1180px; margin: 0 auto; padding: 20px 20px 64px; }

.company-header {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
  padding: 18px 26px; box-shadow: var(--shadow-desk); flex-wrap: wrap;
}
.company-title { display: flex; align-items: baseline; gap: 12px; }
.company-title h1 { font-family: var(--font-display); font-weight: 800; font-size: 28px; letter-spacing: 0.02em; margin: 0; }
.company-title .level-pill { font-family: var(--font-display); font-weight: 700; font-size: 13px; background: var(--d-decision-soft); color: var(--d-decision); border-radius: 999px; padding: 4px 12px; }
.company-stats { display: flex; gap: 22px; flex-wrap: wrap; }
.stat { text-align: right; }
.stat .stat-value { font-family: var(--font-display); font-size: 20px; font-weight: 700; }
.stat .stat-label { font-size: 12px; color: var(--ink-soft); }
.health-bar-track { width: 90px; height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 4px; }
.health-bar-fill { height: 100%; background: var(--good); border-radius: 999px; }

.office { margin-top: 20px; background: var(--floor); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 22px; position: relative; }
.office-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.meeting-room { margin: 16px 0; background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--radius-md); padding: 12px 18px; display: flex; align-items: center; gap: 14px; min-height: 44px; flex-wrap: wrap; }
.meeting-room .mr-label { font-family: var(--font-display); font-weight: 700; font-size: 12px; color: var(--ink-soft); letter-spacing: 0.04em; }
.meeting-room .mr-msg { font-size: 14px; color: var(--ink); }
.handoff { display: flex; align-items: center; gap: 8px; }
.handoff .mini-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }

.employee-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 16px; box-shadow: var(--shadow-desk); text-align: left; display: flex; flex-direction: column; gap: 10px; transition: transform 0.12s ease, box-shadow 0.12s ease; border-top: 4px solid var(--emp-color, var(--line)); position: relative; }
.employee-card:hover { transform: translateY(-2px); }
.employee-card.working { box-shadow: 0 2px 0 rgba(38,36,51,0.06), 0 0 0 3px var(--emp-soft, var(--surface-tint)), 0 10px 24px -14px rgba(38, 36, 51, 0.25); }
.employee-card .emp-top { display: flex; align-items: center; gap: 10px; }
.emp-avatar { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; background: var(--emp-soft, var(--surface-tint)); flex-shrink: 0; position: relative; }
.emp-avatar.pulsing::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--emp-color, var(--line)); animation: emp-pulse 1.6s ease-out infinite; }
@keyframes emp-pulse { 0% { transform: scale(0.9); opacity: 0.8; } 100% { transform: scale(1.35); opacity: 0; } }
.emp-name { font-weight: 700; font-size: 15px; }

.status-badge.idle { background: var(--surface-tint); color: var(--ink-soft); }

.emp-task::before { content: ''; position: absolute; top: -5px; left: 16px; width: 9px; height: 9px; background: var(--surface-tint); transform: rotate(45deg); }

.btn { border: none; border-radius: var(--radius-sm); padding: 9px 16px; font-weight: 700; font-size: 13.5px; background: var(--surface-tint); color: var(--ink); }

.section-heading { display: flex; align-items: center; justify-content: space-between; margin: 30px 0 12px; flex-wrap: wrap; gap: 8px; }
.section-heading h2 { font-family: var(--font-display); font-size: 18px; margin: 0; }

.project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.project-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 16px; box-shadow: var(--shadow-desk); display: flex; flex-direction: column; gap: 10px; }
.project-card .pc-id { font-size: 11px; color: var(--ink-soft); }
.project-card h3 { margin: 0; font-size: 16px; }
.stage-track { display: flex; gap: 3px; }
.stage-seg { flex: 1; height: 7px; border-radius: 4px; background: var(--line); }
.stage-seg.filled { background: var(--good); }
.stage-seg.current { background: var(--warn); }
.pc-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); }
.pc-status-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.empty-state { border: 1px dashed var(--line-strong); border-radius: var(--radius-md); padding: 26px; text-align: center; color: var(--ink-soft); font-size: 14px; background: var(--surface-tint); }

.activity-log { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px 18px; max-height: 260px; overflow-y: auto; box-shadow: var(--shadow-desk); }
.log-row { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--surface-tint); font-size: 13px; }
.log-row:last-child { border-bottom: none; }
.log-time { color: var(--ink-soft); font-variant-numeric: tabular-nums; flex-shrink: 0; }
.log-emp { font-weight: 700; flex-shrink: 0; width: 16px; }

.modal-backdrop { position: fixed; inset: 0; background: rgba(38, 36, 51, 0.4); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
.modal-card { background: var(--surface); border-radius: var(--radius-lg); padding: 24px; width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 60px -20px rgba(38, 36, 51, 0.4); }
.modal-card h2 { font-family: var(--font-display); margin: 0 0 4px; font-size: 19px; }
.modal-sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 16px; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.field label { font-size: 12.5px; font-weight: 700; color: var(--ink-soft); }
.field input, .field textarea, .field select { border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 9px 11px; font-size: 13.5px; resize: vertical; background: var(--surface-tint); }
.field textarea { min-height: 70px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
.ai-row { display: flex; justify-content: flex-start; margin-bottom: 14px; }
.ai-error { font-size: 12px; color: var(--bad); margin-top: 6px; }
.review-box { font-size: 12.5px; background: var(--a-idea-soft); color: #7a5a06; border-radius: var(--radius-sm); padding: 9px 11px; margin-bottom: 14px; line-height: 1.5; }

.decision-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.decision-opt { border: 1.5px solid var(--line-strong); border-radius: var(--radius-sm); padding: 9px; text-align: center; font-weight: 700; font-size: 12.5px; background: var(--surface-tint); }
.decision-opt.selected.approved { border-color: var(--good); background: var(--c-money-soft); color: var(--good); }
.decision-opt.selected.revision { border-color: var(--warn); background: var(--a-idea-soft); color: var(--warn); }
.decision-opt.selected.hold { border-color: var(--ink-soft); background: var(--surface-tint); color: var(--ink-soft); }
.decision-opt.selected.rejected { border-color: var(--bad); background: var(--f-sales-soft); color: var(--bad); }
.checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; margin-bottom: 14px; }
.archive-card { border-left: 3px solid var(--bad); }
.reject-reason { font-size: 12.5px; background: var(--f-sales-soft); color: var(--bad); border-radius: var(--radius-sm); padding: 8px 10px; }

.top-actions { display: flex; justify-content: flex-end; gap: 10px; }

@media (max-width: 760px) {
  .office-row { grid-template-columns: 1fr; }
  .company-header { flex-direction: column; align-items: flex-start; }
  .company-stats { justify-content: flex-start; }
}

<body>
<div id="root"></div>

<script type="text/plain" id="app-source">
const { useState, useEffect, useCallback } = React;

/* =========================================================
   0. 接続設定 ― ここを自分の値に書き換えてください
   ・Supabase: Project Settings → Data API(URL) / API Keys(キー)
   ・API_BASE_URL: Cloudflare Workerをデプロイして発行されたURL(例 https://xxxx.yyyy.workers.dev)
========================================================= */
const SUPABASE_URL = 'https://emliruckqsvlddzneczk.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_7mi0OmqNKGTnYdGMtfs58Q_CYY_Qvt_'
const API_BASE_URL = 'https://ai-company-projects.h-onoue-test.workers.dev'

const supabaseConfigured =
  SUPABASE_URL.startsWith('http') && !SUPABASE_URL.includes('YOUR-PROJECT') &&
  SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('YOUR-ANON')

const sb = supabaseConfigured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null

/* =========================================================
   1. 社員マスターデータ(仕様書3〜23章)
========================================================= */
const STAGE_ORDER = ['IDEA', 'PLANNING', 'MONEY', 'APPROVAL', 'DEVELOPMENT', 'SALES']
const STAGE_OWNER = { IDEA: 'A', PLANNING: 'B', MONEY: 'C', APPROVAL: 'D', DEVELOPMENT: 'E', SALES: 'F' }

const EMPLOYEES = [
  { key: 'A', name: '発案担当', roleEn: 'IDEA GENERATOR', icon: '💡', color: 'var(--a-idea)', colorSoft: 'var(--a-idea-soft)', workingLabel: 'THINKING', catchphrase: '新しいアイデアを探しています' },
  { key: 'B', name: '企画担当', roleEn: 'PLANNER', icon: '📋', color: 'var(--b-plan)', colorSoft: 'var(--b-plan-soft)', workingLabel: 'PLANNING', catchphrase: '企画書を作成中' },
  { key: 'C', name: 'マネタイズ担当', roleEn: 'MONETIZER', icon: '💰', color: 'var(--c-money)', colorSoft: 'var(--c-money-soft)', workingLabel: 'ANALYZING', catchphrase: '収益モデルを計算中' },
  { key: 'D', name: '責任者', roleEn: 'EXECUTIVE / PM', icon: '👔', color: 'var(--d-decision)', colorSoft: 'var(--d-decision-soft)', workingLabel: 'REVIEWING', catchphrase: '開発する価値があるか検討中' },
  { key: 'E', name: '開発担当', roleEn: 'DEVELOPER', icon: '💻', color: 'var(--e-dev)', colorSoft: 'var(--e-dev-soft)', workingLabel: 'CODING', catchphrase: 'ツールを開発しています' },
  { key: 'F', name: '営業担当', roleEn: 'SALES / MARKETER', icon: '📱', color: 'var(--f-sales)', colorSoft: 'var(--f-sales-soft)', workingLabel: 'SELLING', catchphrase: '見込み客を探しています' },
]
const EMPLOYEE_MAP = Object.fromEntries(EMPLOYEES.map((e) => [e.key, e]))

/* =========================================================
   2. Supabase読み書きヘルパー
========================================================= */
function fromDbProject(row) {
  return {
    id: row.id, title: row.title, problem: row.problem, solution: row.solution,
    target: row.target, source: row.source, stage: row.stage, decision: row.decision,
    rejectReason: row.reject_reason || '', scores: row.scores || {}, notes: row.notes || {},
    approvalHistory: row.approval_history || [], customerAcquired: !!row.customer_acquired,
    createdAt: new Date(row.created_at).getTime(), updatedAt: new Date(row.updated_at).getTime(),
  }
}
function fromDbLog(row) {
  return {
    id: `log-${row.id}`,
    time: new Date(row.created_at).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }),
    key: row.employee_key, message: row.message,
  }
}
async function fetchAll() {
  const [{ data: projectRows, error: pErr }, { data: logRows, error: lErr }] = await Promise.all([
    sb.from('projects').select('*').order('created_at', { ascending: false }),
    sb.from('activity_log').select('*').order('created_at', { ascending: false }).limit(200),
  ])
  if (pErr) throw pErr
  if (lErr) throw lErr
  return { projects: (projectRows || []).map(fromDbProject), activityLog: (logRows || []).map(fromDbLog) }
}
async function logActivity(employeeKey, message) {
  const { error } = await sb.from('activity_log').insert({ employee_key: employeeKey, message })
  if (error) throw error
}
const nowIso = () => new Date().toISOString()
const timeLabel = () => new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })

/* =========================================================
   3. AI下書き呼び出し(独立したCloudflare Workerを叩く。Gemini→Workers AIの順にフォールバック)
========================================================= */
async function callAI(employeeKey, ctx) {
  if (API_BASE_URL.includes('YOUR-WORKER')) {
    throw new Error('API_BASE_URLが未設定です(index.html冒頭のAPI_BASE_URLを、デプロイしたWorkerのURLに書き換えてください)')
  }
  const res = await fetch(API_BASE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ employeeKey, ctx }),
  })
  const json = await res.json().catch(() => null)
  if (!res.ok || !json || !json.ok) {
    throw new Error((json && json.error) || `AI呼び出しに失敗しました(status ${res.status})`)
  }
  return { data: json.data, provider: json.provider }
}
const PROVIDER_LABEL = { gemini: 'Gemini', 'workers-ai': 'Cloudflare Workers AI(フォールバック)' }

/* =========================================================
   4. 状態管理フック(Supabase + Realtime)
========================================================= */
function useCompanyState() {
  const [state, setState] = useState({ projects: [], activityLog: [], loading: true, error: null })

  const refresh = useCallback(async () => {
    try {
      const data = await fetchAll()
      setState((s) => ({ ...s, ...data, loading: false, error: null }))
    } catch (e) {
      setState((s) => ({ ...s, loading: false, error: e.message }))
    }
  }, [])

  useEffect(() => {
    if (!supabaseConfigured) {
      setState((s) => ({ ...s, loading: false, error: 'NOT_CONFIGURED' }))
      return
    }
    refresh()
    const channel = sb.channel('company-sync')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'projects' }, refresh)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'activity_log' }, refresh)
      .subscribe()
    return () => sb.removeChannel(channel)
  }, [refresh])

  const dispatch = useCallback(async (action) => {
    if (!supabaseConfigured) return
    const { type, payload } = action
    const findProject = (id) => state.projects.find((p) => p.id === id)
    try {
      if (type === 'ADD_IDEA') {
        const id = `PRJ-${Date.now().toString(36).toUpperCase()}`
        const { error } = await sb.from('projects').insert({
          id, title: payload.title, problem: payload.problem, solution: payload.solution,
          target: payload.target, source: payload.source || '未記入', stage: 'IDEA',
        })
        if (error) throw error
        await logActivity('A', `新しいアイデアを提出「${payload.title}」（${id}）`)
      } else if (type === 'ADVANCE_PLAN') {
        const { projectId, note } = payload
        const project = findProject(projectId)
        const { error } = await sb.from('projects').update({ stage: 'PLANNING', notes: { ...project?.notes, planning: note }, updated_at: nowIso() }).eq('id', projectId)
        if (error) throw error
        await logActivity('B', `企画を完成させました（${project?.title ?? projectId}）`)
      } else if (type === 'ADVANCE_MONEY') {
        const { projectId, note, market, score } = payload
        const project = findProject(projectId)
        const { error } = await sb.from('projects').update({ stage: 'MONEY', notes: { ...project?.notes, money: note, market }, scores: { ...project?.scores, monetization: score }, updated_at: nowIso() }).eq('id', projectId)
        if (error) throw error
        await logActivity('C', `収益性と市場調査を分析：Monetization Score ${score}（${project?.title ?? projectId}）`)
      } else if (type === 'DECIDE') {
        const { projectId, decision, reason } = payload
        const project = findProject(projectId)
        if (!project) return
        const historyEntry = { decision, reason, time: timeLabel() }
        let nextStage = project.stage
        let log = ''
        if (decision === 'APPROVED') { nextStage = 'DEVELOPMENT'; log = `APPROVED — 開発を開始します（${project.title}）` }
        else if (decision === 'NEEDS_REVISION') { nextStage = 'PLANNING'; log = `NEEDS_REVISION — 企画工程へ差し戻し（${project.title}）：${reason}` }
        else if (decision === 'HOLD') { nextStage = 'APPROVAL'; log = `HOLD — 現時点では保留（${project.title}）` }
        else { nextStage = 'REJECTED'; log = `REJECTED（${project.title}）：${reason}` }
        const { error } = await sb.from('projects').update({
          stage: nextStage, decision: decision === 'REJECTED' ? null : decision,
          reject_reason: decision === 'REJECTED' ? reason : project.rejectReason,
          approval_history: [...project.approvalHistory, historyEntry], updated_at: nowIso(),
        }).eq('id', projectId)
        if (error) throw error
        await logActivity('D', log)
      } else if (type === 'ADVANCE_DEV') {
        const { projectId, note, score } = payload
        const project = findProject(projectId)
        const { error } = await sb.from('projects').update({ stage: 'SALES', notes: { ...project?.notes, development: note }, scores: { ...project?.scores, development: score }, updated_at: nowIso() }).eq('id', projectId)
        if (error) throw error
        await logActivity('E', `開発が完了しました（${project?.title ?? projectId}）`)
      } else if (type === 'ADVANCE_SALES') {
        const { projectId, note, score, customerAcquired } = payload
        const project = findProject(projectId)
        const { error } = await sb.from('projects').update({ stage: 'COMPLETED', notes: { ...project?.notes, sales: note }, scores: { ...project?.scores, sales: score }, customer_acquired: !!customerAcquired, updated_at: nowIso() }).eq('id', projectId)
        if (error) throw error
        await logActivity('F', customerAcquired ? `🎉 CUSTOMER ACQUIRED（${project?.title ?? projectId}）` : `営業結果を記録しました（${project?.title ?? projectId}）`)
      } else if (type === 'REOPEN') {
        const { projectId } = payload
        const project = findProject(projectId)
        const { error } = await sb.from('projects').update({ stage: 'IDEA', decision: null, updated_at: nowIso() }).eq('id', projectId)
        if (error) throw error
        await logActivity('A', `過去に却下したアイデアを再評価します（${project?.title ?? projectId}）`)
      }
      refresh()
    } catch (e) {
      setState((s) => ({ ...s, error: e.message }))
    }
  }, [state.projects, refresh])

  return { state, dispatch }
}

function deriveEmployeeState(projects, key) {
  const stage = Object.keys(STAGE_OWNER).find((s) => STAGE_OWNER[s] === key)
  const active = projects.find((p) => p.stage === stage)
  if (active) return { status: 'WORKING', currentProject: active }
  const blocked = projects.find((p) => key === 'D' && p.stage === 'APPROVAL' && p.decision === 'HOLD')
  if (blocked) return { status: 'WAITING', currentProject: blocked }
  return { status: 'IDLE', currentProject: null }
}

function computeCompanyStats(state) {
  const { projects } = state
  const counts = Object.fromEntries(STAGE_ORDER.map((s) => [s, 0]))
  let completed = 0, rejected = 0, customers = 0, potentialRevenue = 0
  for (const p of projects) {
    if (p.stage === 'COMPLETED') { completed += 1; if (p.customerAcquired) customers += 1 }
    else if (p.stage === 'REJECTED') rejected += 1
    else if (counts[p.stage] !== undefined) counts[p.stage] += 1
    if (p.scores?.monetization) potentialRevenue += p.scores.monetization * 3000
  }
  const health = Math.max(10, Math.min(100, 70 + completed * 6 + customers * 8 - rejected * 3))
  const level = 1 + Math.floor(completed / 2) + customers
  return { counts, completed, rejected, customers, potentialRevenue, health, level, total: projects.length }
}

function OfficeScreen({ projects, onSelectEmployee }) {
  const topRow = EMPLOYEES.slice(0, 3)
  const bottomRow = EMPLOYEES.slice(3, 6)
  const active = projects.filter((p) => p.stage !== 'COMPLETED' && p.stage !== 'REJECTED')
  const mostRecent = [...projects].sort((a, b) => b.updatedAt - a.updatedAt)[0]
  const mostRecentActive = [...active].sort((a, b) => b.updatedAt - a.updatedAt)[0]
  const handoffTo = mostRecentActive ? EMPLOYEE_MAP[STAGE_OWNER[mostRecentActive.stage]] : null
  const handoffFrom = handoffTo ? getUpstreamEmployee(handoffTo.key) : null

  const linkMap = {}
  for (const emp of EMPLOYEES) {
    const d = deriveEmployeeState(projects, emp.key)
    if (d.status === 'WORKING') {
      const upstream = getUpstreamEmployee(emp.key)
      if (upstream) linkMap[emp.key] = upstream
    }
  }

  return (
    <section className="office">
      <div className="office-row">
        {topRow.map((emp) => <EmployeeCard key={emp.key} employee={emp} derived={deriveEmployeeState(projects, emp.key)} linkedWith={linkMap[emp.key]} onClick={() => onSelectEmployee(emp.key)} />)}
      </div>
      <div className="meeting-room">
        <span className="mr-label">MEETING ROOM</span>

            <span className="mini-avatar" style={{ background: handoffTo.colorSoft }}>{handoffTo.icon}</span>

      <h3>{project.title}</h3>
      <div className="stage-track">
        {STAGE_ORDER.map((s, i) => {
          let cls = 'stage-seg'
          if (isCompleted) cls += ' filled'
          else if (i < currentIndex) cls += ' filled'
          else if (i === currentIndex && !isRejected) cls += ' current'
          return <div key={s} className={cls} />

const DECISIONS = [
  { key: 'APPROVED', label: 'APPROVED', cls: 'approved' },
  { key: 'NEEDS_REVISION', label: 'NEEDS_REVISION', cls: 'revision' },
  { key: 'HOLD', label: 'HOLD', cls: 'hold' },
  { key: 'REJECTED', label: 'REJECTED', cls: 'rejected' },
]

function AdvanceModal({ project, dispatch, onClose }) {
  const [note, setNote] = useState('')
  const [market, setMarket] = useState('')
  const [score, setScore] = useState('')
  const [decision, setDecision] = useState(null)
  const [reason, setReason] = useState('')
  const [customerAcquired, setCustomerAcquired] = useState(false)
  const [aiLoading, setAiLoading] = useState(false)
  const [aiError, setAiError] = useState('')
  const [aiProvider, setAiProvider] = useState('')
  const [aiReview, setAiReview] = useState('')
  const stage = project.stage

  const runAI = async () => {
    setAiLoading(true); setAiError(''); setAiProvider(''); setAiReview('')
    try {
      const ctx = {
        title: project.title, problem: project.problem, target: project.target, solution: project.solution,
        planningNote: project.notes.planning, marketNote: project.notes.market, moneyNote: project.notes.money,
        developmentNote: project.notes.development, score: project.scores.monetization,
      }
      const employeeKey = stage === 'IDEA' ? 'B' : stage === 'PLANNING' ? 'C' : (stage === 'MONEY' || stage === 'APPROVAL') ? 'D' : stage === 'DEVELOPMENT' ? 'E' : 'F'
      const { data, provider } = await callAI(employeeKey, ctx)
      if (employeeKey === 'D') { setDecision(data.decision || null); setReason(data.reason || '') }
      else {
        setNote(data.note || '')
        if (data.market !== undefined) setMarket(data.market || '')
        if (data.score !== undefined) setScore(String(data.score))
      }
      if (data.review) setAiReview(data.review)
      setAiProvider(provider)
    } catch (e) { setAiError(e.message) } finally { setAiLoading(false) }
  }

  const submit = () => {
    if (stage === 'IDEA') dispatch({ type: 'ADVANCE_PLAN', payload: { projectId: project.id, note } })
    else if (stage === 'PLANNING') dispatch({ type: 'ADVANCE_MONEY', payload: { projectId: project.id, note, market, score: Number(score) || 0 } })
    else if (stage === 'MONEY' || stage === 'APPROVAL') dispatch({ type: 'DECIDE', payload: { projectId: project.id, decision, reason } })
    else if (stage === 'DEVELOPMENT') dispatch({ type: 'ADVANCE_DEV', payload: { projectId: project.id, note, score: Number(score) || 0 } })
    else if (stage === 'SALES') dispatch({ type: 'ADVANCE_SALES', payload: { projectId: project.id, note, score: Number(score) || 0, customerAcquired } })
    onClose()
  }

  const decisionValid = (stage === 'MONEY' || stage === 'APPROVAL') ? decision && (decision !== 'REJECTED' && decision !== 'NEEDS_REVISION' ? true : reason.trim()) : true
  const noteValid = ['IDEA', 'PLANNING', 'DEVELOPMENT', 'SALES'].includes(stage) ? note.trim() : true
  const canSubmit = decisionValid && noteValid

  const REVIEW_LABEL = { IDEA: 'Bによる確認(Aのアイデアをチェック)', PLANNING: 'Cによる確認(Bの企画をチェック)', DEVELOPMENT: 'Eによる確認(Dの承認内容をチェック)', SALES: 'Fによる確認(Eの開発内容をチェック)' }

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-card" onClick={(e) => e.stopPropagation()}>
        <h2>#{project.id}「{project.title}」</h2>

        <div className="ai-row">
          <button className="btn btn-ai" disabled={aiLoading} onClick={runAI}>{aiLoading ? '生成中…' : '🤖 AIに下書きさせる'}</button>
        </div>
        {aiError && <div className="ai-error">{aiError}</div>}
        {aiProvider && <div className="muted" style={{ fontSize: 12, marginBottom: 10 }}>{PROVIDER_LABEL[aiProvider] || aiProvider}が下書きしました。内容を確認してから記録してください。</div>}
        {aiReview && <div className="review-box">🔍 {REVIEW_LABEL[stage] || '前工程の確認'}：{aiReview}</div>}

        {stage === 'IDEA' && <div className="field"><label>企画メモ(Target/Solution/MVP/差別化など)</label><textarea value={note} onChange={(e) => setNote(e.target.value)} /></div>}

        {stage === 'PLANNING' && (
          <>
            <div className="field"><label>収益モデル・検討メモ</label><textarea value={note} onChange={(e) => setNote(e.target.value)} /></div>
            <div className="field"><label>市場調査メモ(市場規模・競合・支払意欲)</label><textarea value={market} onChange={(e) => setMarket(e.target.value)} /></div>
            <div className="field"><label>Monetization Score(0〜100)</label><input type="number" min="0" max="100" value={score} onChange={(e) => setScore(e.target.value)} /></div>
          </>
        )}

        {(stage === 'MONEY' || stage === 'APPROVAL') && (
          <>
            <div className="decision-grid">
              {DECISIONS.map((d) => <button key={d.key} className={`decision-opt ${decision === d.key ? `selected ${d.cls}` : ''}`} onClick={() => setDecision(d.key)}>{d.label}</button>)}
            </div>
            <div className="field"><label>判断理由{decision === 'REJECTED' || decision === 'NEEDS_REVISION' ? '(必須)' : '(任意)'}</label><textarea value={reason} onChange={(e) => setReason(e.target.value)} /></div>
          </>
        )}

        {stage === 'DEVELOPMENT' && (
          <>
            <div className="field"><label>開発メモ</label><textarea value={note} onChange={(e) => setNote(e.target.value)} /></div>
            <div className="field"><label>Code Quality Score(任意)</label><input type="number" min="0" max="100" value={score} onChange={(e) => setScore(e.target.value)} /></div>
          </>
        )}

        {stage === 'SALES' && (
          <>
            <div className="field"><label>営業結果メモ</label><textarea value={note} onChange={(e) => setNote(e.target.value)} /></div>
            <div className="field"><label>Lead Score(任意)</label><input type="number" min="0" max="100" value={score} onChange={(e) => setScore(e.target.value)} /></div>
            <label className="checkbox-row"><input type="checkbox" checked={customerAcquired} onChange={(e) => setCustomerAcquired(e.target.checked)} />契約・顧客化に至った</label>
          </>
        )}

        <div className="modal-actions">
          <button className="btn" onClick={onClose}>キャンセル</button>
          <button className="btn btn-primary" disabled={!canSubmit} onClick={submit}>記録する</button>
        </div>
      </div>
    </div>
  )
}

function App() {
  const { state, dispatch } = useCompanyState()
  const [selectedEmployeeKey, setSelectedEmployeeKey] = useState(null)
  const [showIdeaForm, setShowIdeaForm] = useState(false)
  const [advanceProject, setAdvanceProject] = useState(null)
  const selectedEmployee = EMPLOYEES.find((e) => e.key === selectedEmployeeKey)

  if (state.error === 'NOT_CONFIGURED') {
    return (
      <div className="app-shell">
        <div className="empty-state" style={{ marginTop: 40 }}>
          <h2 style={{ marginTop: 0 }}>Supabaseの接続設定がありません</h2>
          <p>この index.html の先頭付近にある <code>SUPABASE_URL</code> と <code>SUPABASE_ANON_KEY</code> を、
          自分のSupabaseプロジェクトの値に書き換えてください。手順はREADME.mdを参照してください。</p>
        </div>
      </div>
    )
  }
  if (state.loading) {
    return <div className="app-shell"><div className="empty-state" style={{ marginTop: 40 }}>会社の状態を読み込んでいます…</div></div>
  }

  return (
    <div className="app-shell">
      {state.error && <div className="reject-reason" style={{ marginBottom: 14 }}>通信エラー：{state.error}</div>}
      <CompanyHeader state={state} />
      <OfficeScreen projects={state.projects} onSelectEmployee={setSelectedEmployeeKey} />
      <div className="section-heading">
        <h2>PROJECT PIPELINE</h2>
        <div className="top-actions"><button className="btn btn-primary" onClick={() => setShowIdeaForm(true)}>+ 新しいアイデアを登録</button></div>
      </div>
      <ProjectPipeline projects={state.projects} onAdvance={setAdvanceProject} />
      <RejectedArchive projects={state.projects} onReopen={(id) => dispatch({ type: 'REOPEN', payload: { projectId: id } })} />
      <div className="section-heading"><h2>ACTIVITY LOG</h2></div>
      <ActivityLog log={state.activityLog} />
      {selectedEmployee && <EmployeeDetailModal employee={selectedEmployee} projects={state.projects} onClose={() => setSelectedEmployeeKey(null)} />}
      {showIdeaForm && <IdeaFormModal onSubmit={(payload) => dispatch({ type: 'ADD_IDEA', payload })} onClose={() => setShowIdeaForm(false)} />}
      {advanceProject && <AdvanceModal project={advanceProject} dispatch={dispatch} onClose={() => setAdvanceProject(null)} />}
    </div>
  )
}

<script>
  // Babel標準の自動スキャン(type="text/babel")は使わない。最新のBabelはデフォルトで
  // "automatic" JSXランタイムを使い、react/jsx-runtimeをimportするコードを生成するが、
  // このページはReactをUMD(グローバル変数)で読み込んでいるためimportが使えず壊れる。
  // そのため手動でBabel.transformを呼び、runtime:'classic'(React.createElementを使う方式)を指定する。
