<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI COMPANY</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap"

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
:root {
  --ink: #262433;
  --ink-soft: #6f6c80;
  --bg: #eaf0f6;
  --floor: #dfe8f1;
  --surface: #ffffff;
  --surface-tint: #f5f7fb;
  --line: #d7dfea;
  --line-strong: #b9c5d6;

  --a-idea: #e8960c;
  --a-idea-soft: #fdf1da;
  --b-plan: #3f7fd1;
  --b-plan-soft: #e2edfb;
  --c-money: #1f9d6c;
  --c-money-soft: #dff3e9;
  --d-decision: #8656c9;
  --d-decision-soft: #ede3fa;
  --e-dev: #1fa39a;
  --e-dev-soft: #dcf3f1;
  --f-sales: #e2557f;
  --f-sales-soft: #fbe3ea;

  --good: #1f9d6c;
  --warn: #e8960c;
  --bad: #d9455f;

  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 9px;

  --shadow-desk: 0 2px 0 rgba(38, 36, 51, 0.06), 0 10px 24px -14px rgba(38, 36, 51, 0.25);

  --font-display: 'Baloo 2', 'Zen Maru Gothic', sans-serif;
  --font-body: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif;
}
* { box-sizing: border-box; }
html, body, #root { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(1100px 500px at 12% -8%, #f4f8fc 0%, transparent 55%), var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  position: relative;
  min-height: 100vh;
}
.bg-balls { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.bg-ball { position: absolute; border-radius: 50%; }
.bg-ball-1 { width: 100px; height: 100px; left: -140px; top: 10%; background: var(--a-idea); animation: cross-ltr 11s linear infinite; animation-delay: 0s; }
.bg-ball-2 { width: 78px; height: 78px; right: -140px; top: 20%; background: var(--b-plan); animation: cross-rtl 13s linear infinite; animation-delay: -3s; }
.bg-ball-3 { width: 116px; height: 116px; left: -140px; top: 52%; background: var(--c-money); animation: cross-ltr 12s linear infinite; animation-delay: -6s; }
.bg-ball-4 { width: 66px; height: 66px; right: -140px; top: 64%; background: var(--d-decision); animation: cross-rtl 9.5s linear infinite; animation-delay: -1.5s; }
.bg-ball-5 { width: 90px; height: 90px; left: -140px; top: 38%; background: var(--e-dev); animation: cross-ltr 14s linear infinite; animation-delay: -8s; }
.bg-ball-6 { width: 84px; height: 84px; right: -140px; top: 78%; background: var(--f-sales); animation: cross-rtl 10.5s linear infinite; animation-delay: -4.5s; }
@keyframes cross-ltr {
  0%   { transform: translateX(0) translateY(0) rotate(0deg); opacity: 0; }
  26%  { opacity: 0; }
  32%  { opacity: 1; transform: translateX(10vw) translateY(-40px) rotate(60deg); }
  46%  { transform: translateX(35vw) translateY(-180px) rotate(220deg); }
  60%  { transform: translateX(60vw) translateY(-20px) rotate(380deg); }
  74%  { transform: translateX(85vw) translateY(-150px) rotate(550deg); }
  90%  { opacity: 1; transform: translateX(115vw) translateY(0) rotate(700deg); }
  96%  { opacity: 0; }
  100% { opacity: 0; transform: translateX(115vw) translateY(0) rotate(700deg); }
}
@keyframes cross-rtl {
  0%   { transform: translateX(0) translateY(0) rotate(0deg); opacity: 0; }
  26%  { opacity: 0; }
  32%  { opacity: 1; transform: translateX(-10vw) translateY(-50px) rotate(-70deg); }
  46%  { transform: translateX(-35vw) translateY(-170px) rotate(-230deg); }
  60%  { transform: translateX(-60vw) translateY(-10px) rotate(-390deg); }
  74%  { transform: translateX(-85vw) translateY(-160px) rotate(-560deg); }
  90%  { opacity: 1; transform: translateX(-115vw) translateY(0) rotate(-710deg); }
  96%  { opacity: 0; }
  100% { opacity: 0; transform: translateX(-115vw) translateY(0) rotate(-710deg); }
}
button { font-family: inherit; cursor: pointer; }
textarea, input, select { font-family: inherit; }

.app-shell { max-width: 1180px; margin: 0 auto; padding: 20px 20px 64px; }

.company-header {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
  padding: 18px 26px; box-shadow: var(--shadow-desk); flex-wrap: wrap;
}
.company-title { display: flex; align-items: baseline; gap: 12px; }
.company-title h1 { font-family: var(--font-display); font-weight: 800; font-size: 28px; letter-spacing: 0.02em; margin: 0; }
.company-title .level-pill { font-family: var(--font-display); font-weight: 700; font-size: 13px; background: var(--d-decision-soft); color: var(--d-decision); border-radius: 999px; padding: 4px 12px; }
.company-stats { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.settings-btn { font-size: 12.5px; padding: 7px 12px; align-self: center; }
.auto-toggle { font-size: 12.5px; padding: 7px 12px; align-self: center; background: var(--surface-tint); border: 1.5px solid var(--line-strong); font-weight: 700; }
.auto-toggle.on { background: var(--c-money-soft); border-color: var(--good); color: var(--good); }
.auto-badge { font-size: 11.5px; font-weight: 700; color: var(--ink-soft); background: var(--surface-tint); border-radius: 999px; padding: 4px 10px; }
.tab-bar { display: flex; gap: 8px; margin: 14px 0; position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 6px 0; }
.tab-btn { flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-md); padding: 10px 12px; font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--ink-soft); box-shadow: var(--shadow-desk); }
.tab-btn.active { background: var(--d-decision); color: #fff; border-color: var(--d-decision); }
.stat { text-align: right; }
.stat .stat-value { font-family: var(--font-display); font-size: 20px; font-weight: 700; }
.stat .stat-label { font-size: 12px; color: var(--ink-soft); }
.health-bar-track { width: 90px; height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 4px; }
.health-bar-fill { height: 100%; background: var(--good); border-radius: 999px; }

.office { margin-top: 20px; background: var(--floor); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 22px; position: relative; }
.link-overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.link-line { opacity: 0.55; animation: link-flow 1s linear infinite; }
@keyframes link-flow { to { stroke-dashoffset: -26; } }
.office-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.meeting-room { margin: 16px 0; background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--radius-md); padding: 12px 18px; display: flex; align-items: center; gap: 14px; min-height: 44px; flex-wrap: wrap; position: relative; z-index: 1; }
.meeting-room .mr-label { font-family: var(--font-display); font-weight: 700; font-size: 12px; color: var(--ink-soft); letter-spacing: 0.04em; }
.meeting-room .mr-msg { font-size: 14px; color: var(--ink); }
.handoff { display: flex; align-items: center; gap: 8px; }
.handoff .mini-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.handoff .arrow { color: var(--ink-soft); font-size: 16px; }

.employee-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 12px; box-shadow: var(--shadow-desk); text-align: left; display: flex; flex-direction: row; align-items: center; gap: 12px; transition: transform 0.12s ease, box-shadow 0.12s ease; border-top: 4px solid var(--emp-color, var(--line)); position: relative; z-index: 1; }
.employee-card:hover { transform: translateY(-2px); }
.employee-card.working { box-shadow: 0 2px 0 rgba(38,36,51,0.06), 0 0 0 3px var(--emp-soft, var(--surface-tint)), 0 10px 24px -14px rgba(38, 36, 51, 0.25); }
.char-stage { width: 108px; height: 108px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; position: relative; }
.action-bubble { position: absolute; top: -6px; right: -6px; z-index: 2; background: var(--surface); border: 2px solid var(--emp-color); border-radius: 999px; padding: 4px 8px; display: flex; align-items: center; gap: 3px; box-shadow: 0 4px 10px rgba(38,36,51,0.18); animation: bubble-pop 0.35s ease; }
.action-emoji { font-size: 15px; line-height: 1; }
.action-dots { display: flex; gap: 2px; }
.action-dots span { width: 4px; height: 4px; border-radius: 50%; background: var(--emp-color); animation: dot-bounce 1s infinite ease-in-out; }
.action-dots span:nth-child(2) { animation-delay: 0.15s; }
.action-dots span:nth-child(3) { animation-delay: 0.3s; }
@keyframes bubble-pop { 0% { transform: scale(0.3); opacity: 0; } 70% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }
@keyframes dot-bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }
.char-figure { width: 108px; height: 108px; position: relative; z-index: 1; }
.char-img { width: 100%; height: 100%; object-fit: contain; display: block; }
.char-stage.pulsing .char-figure { animation: char-pulse 1.6s ease-in-out infinite; }
@keyframes char-pulse { 0%, 100% { filter: drop-shadow(0 0 0 transparent); } 50% { filter: drop-shadow(0 0 10px var(--emp-color)); } }
.emp-body { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.emp-info { text-align: left; }
.emp-name { font-weight: 700; font-size: 15px; }
.emp-role { font-size: 11px; color: var(--ink-soft); }
.status-badge { align-self: flex-start; font-family: var(--font-display); font-size: 11px; font-weight: 700; letter-spacing: 0.04em; padding: 3px 10px; border-radius: 999px; background: var(--emp-soft, var(--surface-tint)); color: var(--emp-color, var(--ink-soft)); }
.status-badge.idle { background: var(--surface-tint); color: var(--ink-soft); }
.emp-task { width: 100%; font-size: 12px; color: var(--ink-soft); line-height: 1.4; min-height: 0; background: var(--surface-tint); border-radius: var(--radius-sm); padding: 6px 9px; position: relative; text-align: left; box-sizing: border-box; }
.emp-task::before { content: ''; position: absolute; top: -5px; left: 16px; width: 9px; height: 9px; background: var(--surface-tint); transform: rotate(45deg); }
.emp-link-chip { align-self: flex-start; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-tint); border: 1px dashed var(--line-strong); color: var(--ink-soft); }

.btn { border: none; border-radius: var(--radius-sm); padding: 9px 16px; font-weight: 700; font-size: 13.5px; background: var(--surface-tint); color: var(--ink); }
.btn-primary { background: var(--d-decision); color: white; }
.btn-primary:hover { filter: brightness(1.05); }
.btn-ghost { background: transparent; border: 1px solid var(--line-strong); }
.btn-ai { background: var(--e-dev-soft); color: var(--e-dev); border: 1px solid var(--e-dev); }
.btn-small { padding: 6px 12px; font-size: 12.5px; border-radius: 999px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.section-heading { display: flex; align-items: center; justify-content: space-between; margin: 30px 0 12px; flex-wrap: wrap; gap: 8px; }
.section-heading h2 { font-family: var(--font-display); font-size: 18px; margin: 0; }

.project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.project-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 16px; box-shadow: var(--shadow-desk); display: flex; flex-direction: column; gap: 10px; }
.project-card-clickable { cursor: pointer; transition: transform 0.12s ease; }
.project-card-clickable:hover { transform: translateY(-2px); }
.pc-detail-link { font-size: 11.5px; color: var(--d-decision); font-weight: 700; }
.project-card.frozen { opacity: 0.72; background: #eef4f8; border-style: dashed; }
.freeze-btn { align-self: flex-start; font-size: 11.5px; padding: 5px 10px; }
.detail-text { font-size: 13px; color: var(--ink); line-height: 1.6; background: var(--surface-tint); border-radius: var(--radius-sm); padding: 9px 11px; white-space: pre-wrap; }
.project-card .pc-id { font-size: 11px; color: var(--ink-soft); }
.project-card h3 { margin: 0; font-size: 16px; }
.stage-track { display: flex; gap: 3px; }
.stage-seg { flex: 1; height: 7px; border-radius: 4px; background: var(--line); }
.stage-seg.filled { background: var(--good); }
.stage-seg.current { background: var(--warn); }
.pc-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); }
.pc-status-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.empty-state { border: 1px dashed var(--line-strong); border-radius: var(--radius-md); padding: 26px; text-align: center; color: var(--ink-soft); font-size: 14px; background: var(--surface-tint); }

.activity-log { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px 18px; max-height: 260px; overflow-y: auto; box-shadow: var(--shadow-desk); }
.log-row { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--surface-tint); font-size: 13px; }
.log-row:last-child { border-bottom: none; }
.log-time { color: var(--ink-soft); font-variant-numeric: tabular-nums; flex-shrink: 0; }
.log-emp { font-weight: 700; flex-shrink: 0; width: 16px; }

.modal-backdrop { position: fixed; inset: 0; background: rgba(38, 36, 51, 0.4); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
.modal-card { background: var(--surface); border-radius: var(--radius-lg); padding: 24px; width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 60px -20px rgba(38, 36, 51, 0.4); }
.modal-card h2 { font-family: var(--font-display); margin: 0 0 4px; font-size: 19px; }
.modal-sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 16px; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.field label { font-size: 12.5px; font-weight: 700; color: var(--ink-soft); }
.field input, .field textarea, .field select { border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 9px 11px; font-size: 13.5px; resize: vertical; background: var(--surface-tint); }
.field textarea { min-height: 70px; }
.code-area { min-height: 160px; font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-size: 12px; white-space: pre; }
.field-actions { display: flex; justify-content: flex-end; margin-top: 6px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
.ai-row { display: flex; justify-content: flex-start; margin-bottom: 14px; }
.ai-error { font-size: 12px; color: var(--bad); margin-top: 6px; }
.review-box { font-size: 12.5px; background: var(--a-idea-soft); color: #7a5a06; border-radius: var(--radius-sm); padding: 9px 11px; margin-bottom: 14px; line-height: 1.5; }

.decision-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.decision-opt { border: 1.5px solid var(--line-strong); border-radius: var(--radius-sm); padding: 9px; text-align: center; font-weight: 700; font-size: 12.5px; background: var(--surface-tint); }
.decision-opt.selected.approved { border-color: var(--good); background: var(--c-money-soft); color: var(--good); }
.decision-opt.selected.revision { border-color: var(--warn); background: var(--a-idea-soft); color: var(--warn); }
.decision-opt.selected.hold { border-color: var(--ink-soft); background: var(--surface-tint); color: var(--ink-soft); }
.decision-opt.selected.rejected { border-color: var(--bad); background: var(--f-sales-soft); color: var(--bad); }
.checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; margin-bottom: 14px; }
.archive-card { border-left: 3px solid var(--bad); }
.reject-reason { font-size: 12.5px; background: var(--f-sales-soft); color: var(--bad); border-radius: var(--radius-sm); padding: 8px 10px; }
.muted { color: var(--ink-soft); }
.top-actions { display: flex; justify-content: flex-end; gap: 10px; }
.emp-task, .mr-msg, .log-row span:last-child, .project-card h3, .reject-reason, .review-box, .modal-card h2 { overflow-wrap: break-word; word-break: break-word; }

@media (max-width: 760px) {
  .app-shell { padding: 14px 14px 48px; }
  .office { padding: 16px; }
  .office-row { grid-template-columns: 1fr; }
  .company-header { flex-direction: column; align-items: flex-start; padding: 16px 18px; }
  .company-title h1 { font-size: 22px; }
  .company-stats { width: 100%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .stat { text-align: left; }
  .health-bar-track { width: 100%; }
  .project-grid { grid-template-columns: 1fr; }
  .section-heading { flex-direction: column; align-items: stretch; }
  .top-actions, .top-actions .btn { width: 100%; }
  .ai-row, .ai-row .btn { width: 100%; }
  .modal-backdrop { padding: 0; align-items: flex-end; }
  .modal-card { padding: 18px; max-width: 100%; max-height: 92vh; border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
  .field input, .field textarea, .field select { font-size: 16px; } /* iOSでフォーカス時に勝手に拡大されるのを防ぐ */
  .btn { padding: 11px 16px; }
  .modal-actions { flex-direction: column; }
  .modal-actions .btn { width: 100%; }
  .checkbox-row input[type="checkbox"] { width: 18px; height: 18px; }
  .handoff { flex-wrap: wrap; }
}

@media (max-width: 420px) {
  .company-stats { gap: 10px; }
  .char-stage { width: 76px; height: 76px; }
  .char-figure { width: 76px; height: 76px; }
  .decision-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<script type="text/plain" id="app-source">
const { useState, useEffect, useCallback, useRef } = React;

/* =========================================================
   0. 接続設定 ― これらは「初期値」です。実際の値は⚙️設定ページから
   このブラウザに保存して上書きできます(index.htmlを書き換えなくてよくなります)。
   ・Supabase: Project Settings → Data API(URL) / API Keys(キー)
   ・API_BASE_URL: Cloudflare Workerをデプロイして発行されたURL(例 https://xxxx.yyyy.workers.dev)
   ・API_SHARED_SECRET: API用Workerの環境変数 API_SHARED_SECRET と同じ値を入れる(任意・セキュリティ強化用)
========================================================= */
const CONFIG_KEYS = ['SUPABASE_URL', 'SUPABASE_ANON_KEY', 'API_BASE_URL', 'API_SHARED_SECRET']
const CONFIG_STORAGE_PREFIX = 'ai_company_config_'
const DEFAULT_CONFIG = {
  SUPABASE_URL: 'https://emliruckqsvlddzneczk.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_7mi0OmqNKGTnYdGMtfs58Q_CYY_Qvt_',
  API_BASE_URL: 'https://flat-smoke-5a71.h-onoue-test.workers.dev',
  API_SHARED_SECRET: '', // 例: 'my-secret-123'。API Worker側と同じ値にする。空文字なら未使用
}

function readStoredConfig(key) {
  try {
    const v = localStorage.getItem(CONFIG_STORAGE_PREFIX + key)
    return v !== null && v !== '' ? v : null
  } catch { return null }
}
function getConfigValue(key) {
  return readStoredConfig(key) ?? DEFAULT_CONFIG[key]
}

const SUPABASE_URL = getConfigValue('SUPABASE_URL')
const SUPABASE_ANON_KEY = getConfigValue('SUPABASE_ANON_KEY')
const API_BASE_URL = getConfigValue('API_BASE_URL')
const API_SHARED_SECRET = getConfigValue('API_SHARED_SECRET')

const supabaseConfigured =
  SUPABASE_URL.startsWith('http') && !SUPABASE_URL.includes('YOUR-PROJECT') &&
  SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('YOUR-ANON')

const sb = supabaseConfigured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null

/* =========================================================
   1. 社員マスターデータ(仕様書3〜23章)
========================================================= */
const STAGE_ORDER = ['IDEA', 'PLANNING', 'MONEY', 'APPROVAL', 'DEVELOPMENT', 'SALES']
const STAGE_OWNER = { IDEA: 'A', PLANNING: 'B', MONEY: 'C', APPROVAL: 'D', DEVELOPMENT: 'E', SALES: 'F' }

function fromDbProject(row) {
  return {
    id: row.id, title: row.title, problem: row.problem, solution: row.solution,
    target: row.target, source: row.source, stage: row.stage, decision: row.decision,
    rejectReason: row.reject_reason || '', scores: row.scores || {}, notes: row.notes || {},
    approvalHistory: row.approval_history || [], customerAcquired: !!row.customer_acquired,
    createdAt: new Date(row.created_at).getTime(), updatedAt: new Date(row.updated_at).getTime(),
  }
}
function fromDbLog(row) {
  return {
    id: `log-${row.id}`,
    time: new Date(row.created_at).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }),
    key: row.employee_key, message: row.message,
  }
}
async function fetchAll() {
  const [{ data: projectRows, error: pErr }, { data: logRows, error: lErr }] = await Promise.all([
    sb.from('projects').select('*').order('created_at', { ascending: false }),
    sb.from('activity_log').select('*').order('created_at', { ascending: false }).limit(200),
  ])
  if (pErr) throw pErr
  if (lErr) throw lErr
  return { projects: (projectRows || []).map(fromDbProject), activityLog: (logRows || []).map(fromDbLog) }
}
async function logActivity(employeeKey, message) {
  const { error } = await sb.from('activity_log').insert({ employee_key: employeeKey, message })
  if (error) throw error
}
const nowIso = () => new Date().toISOString()
const timeLabel = () => new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })

/* =========================================================
   3. AI下書き呼び出し(独立したCloudflare Workerを叩く。Gemini→Workers AIの順にフォールバック)
========================================================= */
async function callAI(employeeKey, ctx) {
  if (API_BASE_URL.includes('YOUR-WORKER')) {
    throw new Error('API_BASE_URLが未設定です(index.html冒頭のAPI_BASE_URLを、デプロイしたWorkerのURLに書き換えてください)')
  }
  const headers = { 'Content-Type': 'application/json' }
  if (API_SHARED_SECRET) headers['X-Site-Secret'] = API_SHARED_SECRET
  const controller = new AbortController()
  const timeout = setTimeout(() => controller.abort(), 45000)
  let res
  try {
    res = await fetch(API_BASE_URL, {
      method: 'POST',
      headers,
      body: JSON.stringify({ employeeKey, ctx }),
      signal: controller.signal,
    })
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('AI呼び出しがタイムアウトしました(45秒)。時間をおいてもう一度試してください。')
    throw e
  } finally {
    clearTimeout(timeout)
  }
  const json = await res.json().catch(() => null)
  if (!res.ok || !json || !json.ok) {
    throw new Error((json && json.error) || `AI呼び出しに失敗しました(status ${res.status})`)
  }
  return { data: json.data, provider: json.provider }
}
const PROVIDER_LABEL = { gemini: 'Gemini', 'workers-ai': 'Cloudflare Workers AI(フォールバック)' }

/* =========================================================
   3.5 自動パイプライン(🤖自動モードON時、AIの下書きをそのまま採用して次工程へ進める)
========================================================= */
function stageEmployeeKey(stage) {
  if (stage === 'IDEA') return 'B'
  if (stage === 'PLANNING') return 'C'
  if (stage === 'MONEY' || stage === 'APPROVAL') return 'D'
  if (stage === 'DEVELOPMENT') return 'E'
  if (stage === 'SALES') return 'F'
  return null
}

async function autoAdvanceProject(project, dispatch) {
  const employeeKey = stageEmployeeKey(project.stage)
  if (!employeeKey) return
  const ctx = {
    title: project.title, problem: project.problem, target: project.target, solution: project.solution,
    planningNote: project.notes.planning, marketNote: project.notes.market, moneyNote: project.notes.money,
    developmentNote: project.notes.development, score: project.scores.monetization,
  }
  const { data } = await callAI(employeeKey, ctx)
  if (employeeKey === 'B') {
    await dispatch({ type: 'ADVANCE_PLAN', payload: { projectId: project.id, note: data.note || '', review: data.review || '', auto: true } })
  } else if (employeeKey === 'C') {
    await dispatch({ type: 'ADVANCE_MONEY', payload: { projectId: project.id, note: data.note || '', market: data.market || '', score: Number(data.score) || 0, review: data.review || '', auto: true } })
  } else if (employeeKey === 'D') {
    await dispatch({ type: 'DECIDE', payload: { projectId: project.id, decision: data.decision || 'HOLD', reason: data.reason || '', auto: true } })
  } else if (employeeKey === 'E') {
    await dispatch({ type: 'ADVANCE_DEV', payload: { projectId: project.id, note: data.note || '', code: data.code || '', score: Number(data.score) || 0, review: data.review || '', auto: true } })
  } else if (employeeKey === 'F') {
    await dispatch({ type: 'ADVANCE_SALES', payload: { projectId: project.id, note: data.note || '', posts: Array.isArray(data.posts) ? data.posts : [], outreach: data.outreach || '', score: Number(data.score) || 0, customerAcquired: false, review: data.review || '', auto: true } })
  }
}

/* =========================================================
   4. 状態管理フック(Supabase + Realtime)
========================================================= */
function useCompanyState() {
  const [state, setState] = useState({ projects: [], activityLog: [], loading: true, error: null })

  const refresh = useCallback(async () => {
    try {
      const data = await fetchAll()
      setState((s) => ({ ...s, ...data, loading: false, error: null }))
    } catch (e) {
      setState((s) => ({ ...s, loading: false, error: e.message }))
    }
  }, [])

  useEffect(() => {
    if (!supabaseConfigured) {
      setState((s) => ({ ...s, loading: false, error: 'NOT_CONFIGURED' }))
      return
    }
    refresh()
    const channel = sb.channel('company-sync')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'projects' }, refresh)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'activity_log' }, refresh)
      .subscribe()
    return () => sb.removeChannel(channel)
  }, [refresh])

  const dispatch = useCallback(async (action) => {
    if (!supabaseConfigured) return
    const { type, payload } = action
    const findProject = (id) => state.projects.find((p) => p.id === id)
    try {
      if (type === 'ADD_IDEA') {
        const id = `PRJ-${Date.now().toString(36).toUpperCase()}`
        const { error } = await sb.from('projects').insert({
          id, title: payload.title, problem: payload.problem, solution: payload.solution,
          target: payload.target, source: payload.source || '未記入', stage: 'IDEA',
        })
        if (error) throw error
        await logActivity('A', `新しいアイデアを提出「${payload.title}」（${id}）`)
      } else if (type === 'ADVANCE_PLAN') {
        const { projectId, note, review, auto } = payload
        const project = findProject(projectId)
        const { error } = await sb.from('projects').update({ stage: 'PLANNING', notes: { ...project?.notes, planning: note, reviews: { ...project?.notes?.reviews, B: review } }, updated_at: nowIso() }).eq('id', projectId)
        if (error) throw error
        await logActivity('B', `${auto ? '🤖自動：' : ''}企画を完成させました（${project?.title ?? projectId}）`)
        if (review) await logActivity('B', `🔍 Aの確認：${review}`)
      } else if (type === 'ADVANCE_MONEY') {
        const { projectId, note, market, score, review, auto } = payload
        const project = findProject(projectId)
        const { error } = await sb.from('projects').update({ stage: 'MONEY', notes: { ...project?.notes, money: note, market, reviews: { ...project?.notes?.reviews, C: review } }, scores: { ...project?.scores, monetization: score }, updated_at: nowIso() }).eq('id', projectId)
        if (error) throw error
        await logActivity('C', `${auto ? '🤖自動：' : ''}Monetization Score ${score}（${project?.title ?? projectId}）`)
        if (note) await logActivity('C', `💰 判断根拠：${note}`)
        if (market) await logActivity('C', `📊 市場調査：${market}`)
        if (review) await logActivity('C', `🔍 Bの確認：${review}`)
      } else if (type === 'DECIDE') {
        const { projectId, decision, reason, auto } = payload
        const project = findProject(projectId)
        if (!project) return
        const historyEntry = { decision, reason, time: timeLabel() }
        let nextStage = project.stage
        let log = ''
        if (decision === 'APPROVED') { nextStage = 'DEVELOPMENT'; log = `APPROVED — 開発を開始します（${project.title}）` }
        else if (decision === 'NEEDS_REVISION') { nextStage = 'PLANNING'; log = `NEEDS_REVISION — 企画工程へ差し戻し（${project.title}）` }
        else if (decision === 'HOLD') { nextStage = 'APPROVAL'; log = `HOLD — 現時点では保留（${project.title}）` }
        else { nextStage = 'REJECTED'; log = `REJECTED（${project.title}）` }
        const { error } = await sb.from('projects').update({
          stage: nextStage, decision: decision === 'REJECTED' ? null : decision,
          reject_reason: decision === 'REJECTED' ? reason : project.rejectReason,
          approval_history: [...project.approvalHistory, historyEntry], updated_at: nowIso(),
        }).eq('id', projectId)
        if (error) throw error
        await logActivity('D', `${auto ? '🤖自動：' : ''}${log}`)
        if (reason) await logActivity('D', `📋 判断理由：${reason}`)
      } else if (type === 'ADVANCE_DEV') {
        const { projectId, note, code, score, review, auto } = payload
        const project = findProject(projectId)
        const { error } = await sb.from('projects').update({ stage: 'SALES', notes: { ...project?.notes, development: note, code, reviews: { ...project?.notes?.reviews, E: review } }, scores: { ...project?.scores, development: score }, updated_at: nowIso() }).eq('id', projectId)
        if (error) throw error
        await logActivity('E', `${auto ? '🤖自動：' : ''}開発が完了しました（${project?.title ?? projectId}）`)
        if (review) await logActivity('E', `🔍 Dの確認：${review}`)
      } else if (type === 'ADVANCE_SALES') {
        const { projectId, note, posts, outreach, score, customerAcquired, review, auto } = payload
        const project = findProject(projectId)
        const { error } = await sb.from('projects').update({ stage: 'COMPLETED', notes: { ...project?.notes, sales: note, posts, outreach, reviews: { ...project?.notes?.reviews, F: review } }, scores: { ...project?.scores, sales: score }, customer_acquired: !!customerAcquired, updated_at: nowIso() }).eq('id', projectId)
        if (error) throw error
        await logActivity('F', `${auto ? '🤖自動：' : ''}${customerAcquired ? `🎉 CUSTOMER ACQUIRED（${project?.title ?? projectId}）` : `営業結果を記録しました（${project?.title ?? projectId}）`}`)
        if (review) await logActivity('F', `🔍 Eの確認：${review}`)
      } else if (type === 'REOPEN') {
        const { projectId } = payload
        const project = findProject(projectId)
        const { error } = await sb.from('projects').update({ stage: 'IDEA', decision: null, updated_at: nowIso() }).eq('id', projectId)
        if (error) throw error
        await logActivity('A', `過去に却下したアイデアを再評価します（${project?.title ?? projectId}）`)
      } else if (type === 'TOGGLE_FREEZE') {
        const { projectId, frozen } = payload
        const project = findProject(projectId)
        const { error } = await sb.from('projects').update({ notes: { ...project?.notes, frozen }, updated_at: nowIso() }).eq('id', projectId)
        if (error) throw error
        await logActivity(null, `${frozen ? '🧊 凍結しました' : '▶️ 再開しました'}（${project?.title ?? projectId}）`)
      }
      await refresh()
    } catch (e) {
      setState((s) => ({ ...s, error: e.message }))
    }
  }, [state.projects, refresh])

  return { state, dispatch }
}

function deriveEmployeeState(projects, key) {
  const stage = Object.keys(STAGE_OWNER).find((s) => STAGE_OWNER[s] === key)
  const active = projects.find((p) => p.stage === stage)
  if (active) return { status: 'WORKING', currentProject: active }
  const blocked = projects.find((p) => key === 'D' && p.stage === 'APPROVAL' && p.decision === 'HOLD')
  if (blocked) return { status: 'WAITING', currentProject: blocked }
  return { status: 'IDLE', currentProject: null }
}

function computeCompanyStats(state) {
  const { projects } = state
  const counts = Object.fromEntries(STAGE_ORDER.map((s) => [s, 0]))
  let completed = 0, rejected = 0, customers = 0, potentialRevenue = 0
  for (const p of projects) {
    if (p.stage === 'COMPLETED') { completed += 1; if (p.customerAcquired) customers += 1 }
    else if (p.stage === 'REJECTED') rejected += 1
    else if (counts[p.stage] !== undefined) counts[p.stage] += 1
    if (p.scores?.monetization) potentialRevenue += p.scores.monetization * 3000
  }
  const health = Math.max(10, Math.min(100, 70 + completed * 6 + customers * 8 - rejected * 3))
  const level = 1 + Math.floor(completed / 2) + customers
  return { counts, completed, rejected, customers, potentialRevenue, health, level, total: projects.length }
}

function OfficeScreen({ projects, onSelectEmployee }) {
  const officeRef = useRef(null)
  const cardRefs = useRef({})
  const [lines, setLines] = useState([])

  const active = projects.filter((p) => p.stage !== 'COMPLETED' && p.stage !== 'REJECTED')
  const mostRecent = [...projects].sort((a, b) => b.updatedAt - a.updatedAt)[0]
  const mostRecentActive = [...active].sort((a, b) => b.updatedAt - a.updatedAt)[0]
  const handoffTo = mostRecentActive ? EMPLOYEE_MAP[STAGE_OWNER[mostRecentActive.stage]] : null
  const handoffFrom = handoffTo ? getUpstreamEmployee(handoffTo.key) : null

  const linkMap = {}
  for (const emp of EMPLOYEES) {
    const d = deriveEmployeeState(projects, emp.key)
    if (d.status === 'WORKING') {
      const upstream = getUpstreamEmployee(emp.key)
      if (upstream) linkMap[emp.key] = upstream
    }
  }

  const registerCardRef = useCallback((key, node) => {
    cardRefs.current[key] = node
  }, [])

  useEffect(() => {
    function recompute() {
      const officeEl = officeRef.current
      if (!officeEl) return
      const officeRect = officeEl.getBoundingClientRect()
      const next = []
      Object.entries(linkMap).forEach(([toKey, fromEmp]) => {
        const fromEl = cardRefs.current[fromEmp.key]
        const toEl = cardRefs.current[toKey]
        if (!fromEl || !toEl) return
        const fromRect = fromEl.getBoundingClientRect()
        const toRect = toEl.getBoundingClientRect()
        next.push({
          key: fromEmp.key + '-' + toKey,
          x1: fromRect.left + fromRect.width / 2 - officeRect.left,
          y1: fromRect.top + fromRect.height / 2 - officeRect.top,
          x2: toRect.left + toRect.width / 2 - officeRect.left,
          y2: toRect.top + toRect.height / 2 - officeRect.top,
          color: fromEmp.color,
        })
      })
      setLines(next)
    }
    recompute()
    window.addEventListener('resize', recompute)
    return () => window.removeEventListener('resize', recompute)
    // eslint-disable-next-line
  }, [projects])

  return (
    <section className="office" ref={officeRef}>
      <svg className="link-overlay">
        {lines.map((l) => (
          <line key={l.key} x1={l.x1} y1={l.y1} x2={l.x2} y2={l.y2} stroke={l.color} strokeWidth="3" strokeDasharray="7 6" strokeLinecap="round" className="link-line" />
        ))}
      </svg>
      <div className="meeting-room">
        <span className="mr-label">MEETING ROOM</span>
        {handoffFrom && handoffTo ? (
          <div className="handoff">
            <span className="mini-avatar" style={{ background: handoffFrom.colorSoft }}>{handoffFrom.icon}</span>
            <span className="arrow">→</span>
            <span className="mini-avatar" style={{ background: handoffTo.colorSoft }}>{handoffTo.icon}</span>
            <span className="mr-msg">{handoffFrom.name}から{handoffTo.name}へ「{mostRecentActive.title}」を引き継ぎ中</span>
          </div>
        ) : (
          <span className="mr-msg">{mostRecent ? `直近の動き：#${mostRecent.id}「${mostRecent.title}」— ${mostRecent.stage}` : 'まだ案件がありません。まずは社員Aにアイデアを登録してもらいましょう。'}</span>
        )}
      </div>
      <div className="office-row">
        {EMPLOYEES.map((emp) => (
          <EmployeeCard
            key={emp.key}
            employee={emp}
            derived={deriveEmployeeState(projects, emp.key)}
            linkedWith={linkMap[emp.key]}
            onClick={() => onSelectEmployee(emp.key)}
            registerRef={registerCardRef}
          />
        ))}
      </div>
    </section>
  )
}

function ProjectCard({ project, onAdvance, onViewDetail, onToggleFreeze, autoMode }) {
  const currentIndex = STAGE_ORDER.indexOf(project.stage)
  const isCompleted = project.stage === 'COMPLETED'
  const isRejected = project.stage === 'REJECTED'
  const isHold = project.stage === 'APPROVAL' && project.decision === 'HOLD'
  const isFrozen = !!project.notes?.frozen
  const showManualButton = !isCompleted && !isRejected && !isFrozen && (!autoMode || isHold)
  const NEXT_ACTION_LABEL = { IDEA: 'Bへ：企画を作成', PLANNING: 'Cへ：収益性を分析', MONEY: 'Dへ：承認判断', APPROVAL: 'Dへ：再判断', DEVELOPMENT: 'Eへ：開発完了を記録', SALES: 'Fへ：営業結果を記録' }
  return (
    <div className={`project-card project-card-clickable ${isFrozen ? 'frozen' : ''}`} onClick={() => onViewDetail(project)}>
      <div className="pc-id">{project.id}</div>
      <h3>{project.title}</h3>
      <div className="stage-track">
        {STAGE_ORDER.map((s, i) => {
          let cls = 'stage-seg'
          if (isCompleted) cls += ' filled'
          else if (i < currentIndex) cls += ' filled'
          else if (i === currentIndex && !isRejected) cls += ' current'
          return <div key={s} className={cls} />
        })}
      </div>
      <div className="pc-meta"><span>{project.target}</span><span>{project.scores.monetization ? `Money ${project.scores.monetization}` : ''}</span></div>
      <div className="pc-status-row">
        <span className="muted" style={{ fontSize: 12 }}>{isFrozen ? '🧊 凍結中' : isCompleted ? (project.customerAcquired ? '🎉 顧客化しました' : 'COMPLETED') : isRejected ? 'REJECTED' : `STATUS: ${project.stage}`}</span>
        {showManualButton && <button className="btn btn-small btn-primary" onClick={(e) => { e.stopPropagation(); onAdvance(project) }}>{NEXT_ACTION_LABEL[project.stage]}</button>}
        {!isCompleted && !isRejected && !isFrozen && autoMode && !isHold && <span className="auto-badge">🤖 自動処理中…</span>}
      </div>
      {!isCompleted && !isRejected && (
        <button className="btn btn-small btn-ghost freeze-btn" onClick={(e) => { e.stopPropagation(); onToggleFreeze(project.id, !isFrozen) }}>
          {isFrozen ? '▶️ 再開する' : '🧊 凍結する'}
        </button>
      )}
      <div className="pc-detail-link">📄 詳細・出力内容を見る</div>
    </div>
  )
}

function AdvanceModal({ project, dispatch, onClose }) {
  const [note, setNote] = useState('')
  const [market, setMarket] = useState('')
  const [code, setCode] = useState('')
  const [posts, setPosts] = useState(['', ''])
  const [outreach, setOutreach] = useState('')
  const [score, setScore] = useState('')
  const [decision, setDecision] = useState(null)
  const [reason, setReason] = useState('')
  const [customerAcquired, setCustomerAcquired] = useState(false)
  const [aiLoading, setAiLoading] = useState(false)
  const [aiError, setAiError] = useState('')
  const [aiProvider, setAiProvider] = useState('')
  const [aiReview, setAiReview] = useState('')
  const stage = project.stage

  const runAI = async () => {
    setAiLoading(true); setAiError(''); setAiProvider(''); setAiReview('')
    try {
      const ctx = {
        title: project.title, problem: project.problem, target: project.target, solution: project.solution,
        planningNote: project.notes.planning, marketNote: project.notes.market, moneyNote: project.notes.money,
        developmentNote: project.notes.development, score: project.scores.monetization,
      }
      const employeeKey = stage === 'IDEA' ? 'B' : stage === 'PLANNING' ? 'C' : (stage === 'MONEY' || stage === 'APPROVAL') ? 'D' : stage === 'DEVELOPMENT' ? 'E' : 'F'
      const { data, provider } = await callAI(employeeKey, ctx)
      if (employeeKey === 'D') {
        setDecision(data.decision || null); setReason(data.reason || '')
      } else if (employeeKey === 'E') {
        setNote(data.note || '')
        if (data.code !== undefined) setCode(data.code || '')
        if (data.score !== undefined) setScore(String(data.score))
      } else if (employeeKey === 'F') {
        setNote(data.note || '')
        if (Array.isArray(data.posts)) setPosts([data.posts[0] || '', data.posts[1] || ''])
        if (data.outreach !== undefined) setOutreach(data.outreach || '')
        if (data.score !== undefined) setScore(String(data.score))
      } else {
        setNote(data.note || '')
        if (data.market !== undefined) setMarket(data.market || '')
        if (data.score !== undefined) setScore(String(data.score))
      }
      if (data.review) setAiReview(data.review)
      setAiProvider(provider)
    } catch (e) { setAiError(e.message) } finally { setAiLoading(false) }
  }

  const submit = () => {
    if (stage === 'IDEA') dispatch({ type: 'ADVANCE_PLAN', payload: { projectId: project.id, note } })
    else if (stage === 'PLANNING') dispatch({ type: 'ADVANCE_MONEY', payload: { projectId: project.id, note, market, score: Number(score) || 0 } })
    else if (stage === 'MONEY' || stage === 'APPROVAL') dispatch({ type: 'DECIDE', payload: { projectId: project.id, decision, reason } })
    else if (stage === 'DEVELOPMENT') dispatch({ type: 'ADVANCE_DEV', payload: { projectId: project.id, note, code, score: Number(score) || 0 } })
    else if (stage === 'SALES') dispatch({ type: 'ADVANCE_SALES', payload: { projectId: project.id, note, posts, outreach, score: Number(score) || 0, customerAcquired } })
    onClose()
  }

  const decisionValid = (stage === 'MONEY' || stage === 'APPROVAL') ? decision && (decision !== 'REJECTED' && decision !== 'NEEDS_REVISION' ? true : reason.trim()) : true
  const noteValid = ['IDEA', 'PLANNING', 'DEVELOPMENT', 'SALES'].includes(stage) ? note.trim() : true
  const canSubmit = decisionValid && noteValid

  const REVIEW_LABEL = { IDEA: 'Bによる確認(Aのアイデアをチェック)', PLANNING: 'Cによる確認(Bの企画をチェック)', DEVELOPMENT: 'Eによる確認(Dの承認内容をチェック)', SALES: 'Fによる確認(Eの開発内容をチェック)' }

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-card" onClick={(e) => e.stopPropagation()}>
        <h2>#{project.id}「{project.title}」</h2>

        <div className="ai-row">
          <button className="btn btn-ai" disabled={aiLoading} onClick={runAI}>{aiLoading ? '生成中…' : '🤖 AIに下書きさせる'}</button>
        </div>
        {aiError && <div className="ai-error">{aiError}</div>}
        {aiProvider && <div className="muted" style={{ fontSize: 12, marginBottom: 10 }}>{PROVIDER_LABEL[aiProvider] || aiProvider}が下書きしました。内容を確認してから記録してください。</div>}
        {aiReview && <div className="review-box">🔍 {REVIEW_LABEL[stage] || '前工程の確認'}：{aiReview}</div>}

        {stage === 'IDEA' && <div className="field"><label>企画メモ(Target/Solution/MVP/差別化など)</label><textarea value={note} onChange={(e) => setNote(e.target.value)} /></div>}

        {stage === 'PLANNING' && (
          <>
            <div className="field"><label>収益モデル・検討メモ</label><textarea value={note} onChange={(e) => setNote(e.target.value)} /></div>
            <div className="field"><label>市場調査メモ(市場規模・競合・支払意欲)</label><textarea value={market} onChange={(e) => setMarket(e.target.value)} /></div>
            <div className="field"><label>Monetization Score(0〜100)</label><input type="number" min="0" max="100" value={score} onChange={(e) => setScore(e.target.value)} /></div>
          </>
        )}

        {(stage === 'MONEY' || stage === 'APPROVAL') && (
          <>
            <div className="decision-grid">
              {DECISIONS.map((d) => <button key={d.key} className={`decision-opt ${decision === d.key ? `selected ${d.cls}` : ''}`} onClick={() => setDecision(d.key)}>{d.label}</button>)}
            </div>
            <div className="field"><label>判断理由{decision === 'REJECTED' || decision === 'NEEDS_REVISION' ? '(必須)' : '(任意)'}</label><textarea value={reason} onChange={(e) => setReason(e.target.value)} /></div>
          </>
        )}

        {stage === 'DEVELOPMENT' && (
          <>
            <div className="field"><label>開発メモ(何を確認できるプロトタイプか)</label><textarea value={note} onChange={(e) => setNote(e.target.value)} /></div>
            <div className="field">
              <label>プロトタイプのコード(単一HTMLファイル)</label>
              <textarea className="code-area" value={code} onChange={(e) => setCode(e.target.value)} spellCheck={false} />
              <div className="field-actions"><CopyButton text={code} /></div>
            </div>
            <div className="field"><label>Code Quality Score(任意)</label><input type="number" min="0" max="100" value={score} onChange={(e) => setScore(e.target.value)} /></div>
          </>
        )}

        {stage === 'SALES' && (
          <>
            <div className="field"><label>営業結果メモ</label><textarea value={note} onChange={(e) => setNote(e.target.value)} /></div>
            <div className="field">
              <label>SNS投稿文案 1(そのままコピーして使えます)</label>
              <textarea value={posts[0]} onChange={(e) => setPosts([e.target.value, posts[1]])} />
              <div className="field-actions"><CopyButton text={posts[0]} /></div>
            </div>
            <div className="field">
              <label>SNS投稿文案 2(切り口違い)</label>
              <textarea value={posts[1]} onChange={(e) => setPosts([posts[0], e.target.value])} />
              <div className="field-actions"><CopyButton text={posts[1]} /></div>
            </div>
            <div className="field">
              <label>個別アプローチ文面(DM・メール用テンプレート)</label>
              <textarea value={outreach} onChange={(e) => setOutreach(e.target.value)} />
              <div className="field-actions"><CopyButton text={outreach} /></div>
            </div>
            <div className="field"><label>Lead Score(任意)</label><input type="number" min="0" max="100" value={score} onChange={(e) => setScore(e.target.value)} /></div>
            <label className="checkbox-row"><input type="checkbox" checked={customerAcquired} onChange={(e) => setCustomerAcquired(e.target.checked)} />契約・顧客化に至った</label>
            <div className="review-box">📮 送信は必ずご自身で行ってください(自動送信は行いません)。</div>
          </>
        )}

        <div className="modal-actions">
          <button className="btn" onClick={onClose}>キャンセル</button>
          <button className="btn btn-primary" disabled={!canSubmit} onClick={submit}>記録する</button>
        </div>
      </div>
    </div>
  )
}

/* =========================================================
   6. App
========================================================= */
function App() {
  const { state, dispatch } = useCompanyState()
  const [selectedEmployeeKey, setSelectedEmployeeKey] = useState(null)
  const [showIdeaForm, setShowIdeaForm] = useState(false)
  const [advanceProject, setAdvanceProject] = useState(null)
  const [detailProject, setDetailProject] = useState(null)
  const [showSettings, setShowSettings] = useState(false)
  const [activeTab, setActiveTab] = useState('office')
  const [autoMode, setAutoMode] = useState(() => {
    try { return localStorage.getItem('ai_company_automode') === '1' } catch { return false }
  })
  const autoProcessingRef = useRef(new Set())
  const selectedEmployee = EMPLOYEES.find((e) => e.key === selectedEmployeeKey)

  useEffect(() => {
    try { localStorage.setItem('ai_company_automode', autoMode ? '1' : '0') } catch {}
  }, [autoMode])

  useEffect(() => {
    if (!autoMode) return
    function scan() {
      for (const project of state.projects) {
        if (project.stage === 'COMPLETED' || project.stage === 'REJECTED') continue
        if (project.stage === 'APPROVAL' && project.decision === 'HOLD') continue // HOLDは人による確認待ちのまま
        if (project.notes?.frozen) continue // 凍結中はAIを一切呼ばない
        if (autoProcessingRef.current.has(project.id)) continue
        autoProcessingRef.current.add(project.id)
        autoAdvanceProject(project, dispatch)
          .catch((e) => console.error('自動パイプラインでエラー:', project.id, e))
          .finally(() => autoProcessingRef.current.delete(project.id))
      }
    }
    scan()
    const interval = setInterval(scan, 20000) // エラー等で止まったプロジェクトの再試行用
    return () => clearInterval(interval)
    // eslint-disable-next-line
  }, [state.projects, autoMode])

  if (state.error === 'NOT_CONFIGURED') {
    return (
      <div className="app-shell">
        <div className="empty-state" style={{ marginTop: 40 }}>
          <h2 style={{ marginTop: 0 }}>Supabaseの接続設定がありません</h2>
          <p>右上の「⚙️ 設定」からSupabaseの接続情報を入力してください。index.htmlファイルを
          書き換える必要はありません。</p>
          <button className="btn btn-primary" onClick={() => setShowSettings(true)}>⚙️ 設定を開く</button>
        </div>
        {showSettings && <SettingsModal onClose={() => setShowSettings(false)} />}
      </div>
    )
  }
  if (state.loading) {
    return <div className="app-shell"><div className="empty-state" style={{ marginTop: 40 }}>会社の状態を読み込んでいます…</div></div>
  }

  const pipelineCount = state.projects.filter((p) => p.stage !== 'COMPLETED' && p.stage !== 'REJECTED').length

  return (
    <div className="app-shell">
      {state.error && <div className="reject-reason" style={{ marginBottom: 14 }}>通信エラー：{state.error}</div>}
      <CompanyHeader state={state} onOpenSettings={() => setShowSettings(true)} autoMode={autoMode} onToggleAutoMode={() => setAutoMode((v) => !v)} />

      <nav className="tab-bar">
        <button className={`tab-btn ${activeTab === 'office' ? 'active' : ''}`} onClick={() => setActiveTab('office')}>🏢 オフィス</button>
        <button className={`tab-btn ${activeTab === 'pipeline' ? 'active' : ''}`} onClick={() => setActiveTab('pipeline')}>📋 プロジェクト{pipelineCount > 0 ? ` (${pipelineCount})` : ''}</button>
        <button className={`tab-btn ${activeTab === 'log' ? 'active' : ''}`} onClick={() => setActiveTab('log')}>📜 ログ</button>
      </nav>

      {activeTab === 'office' && (
        <OfficeScreen projects={state.projects} onSelectEmployee={setSelectedEmployeeKey} />
      )}

      {activeTab === 'pipeline' && (
        <>
          <div className="section-heading">
            <h2>PROJECT PIPELINE</h2>
            <div className="top-actions"><button className="btn btn-primary" onClick={() => setShowIdeaForm(true)}>+ 新しいアイデアを登録</button></div>
          </div>
          <ProjectPipeline projects={state.projects} onAdvance={setAdvanceProject} onViewDetail={setDetailProject} onToggleFreeze={(id, frozen) => dispatch({ type: 'TOGGLE_FREEZE', payload: { projectId: id, frozen } })} autoMode={autoMode} />
          <RejectedArchive projects={state.projects} onReopen={(id) => dispatch({ type: 'REOPEN', payload: { projectId: id } })} onViewDetail={setDetailProject} />
        </>
      )}

      {activeTab === 'log' && (
        <>
          <div className="section-heading"><h2>ACTIVITY LOG</h2></div>
          <ActivityLog log={state.activityLog} />
        </>
      )}

      {selectedEmployee && <EmployeeDetailModal employee={selectedEmployee} projects={state.projects} onClose={() => setSelectedEmployeeKey(null)} />}
      {showIdeaForm && <IdeaFormModal onSubmit={(payload) => dispatch({ type: 'ADD_IDEA', payload })} onClose={() => setShowIdeaForm(false)} />}
      {advanceProject && <AdvanceModal project={advanceProject} dispatch={dispatch} onClose={() => setAdvanceProject(null)} />}
      {detailProject && <ProjectDetailModal project={detailProject} dispatch={dispatch} onClose={() => setDetailProject(null)} />}
      {showSettings && <SettingsModal onClose={() => setShowSettings(false)} />}
    </div>
  )
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />)
</script>
<script>
  // Babel標準の自動スキャン(type="text/babel")は使わない。最新のBabelはデフォルトで
  // "automatic" JSXランタイムを使い、react/jsx-runtimeをimportするコードを生成するが、
  // このページはReactをUMD(グローバル変数)で読み込んでいるためimportが使えず壊れる。
  // そのため手動でBabel.transformを呼び、runtime:'classic'(React.createElementを使う方式)を指定する。
  var __src = document.getElementById('app-source').textContent
  var __out = Babel.transform(__src, { presets: [['react', { runtime: 'classic' }]] }).code
  var __script = document.createElement('script')
  __script.text = __out
  document.body.appendChild(__script)
</script>
</body>
